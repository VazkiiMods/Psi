plugins {
	id 'base'
	id 'idea'
	id 'com.diffplug.spotless' version '7.2.1'
	id 'net.neoforged.moddev' version '2.0.142' apply false
	id 'net.fabricmc.fabric-loom-remap' version '1.15.5' apply false
}

version = minecraft_version + '-' + mod_version
group = mod_group_id

allprojects {
	version = rootProject.version
	group = rootProject.group

	repositories {
		mavenLocal()
		mavenCentral()
		maven {
			name = 'Sponge'
			url = 'https://repo.spongepowered.org/repository/maven-public/'
			content {
				includeGroup 'org.spongepowered'
			}
		}

		exclusiveContent {
			forRepository {
				maven {
					name = 'sableCompanion'
					url = 'https://maven.ryanhcode.dev/releases'
				}
			}
			filter {
				includeGroup 'dev.ryanhcode.sable-companion'
			}
		}

		maven {
			name = 'blamejared'
			url = 'https://maven.blamejared.com/'
			content {
				includeGroup 'vazkii.patchouli'
				includeGroup 'mezz.jei'
			}
		}

		maven {
			name = 'ParchmentMC'
			url = 'https://maven.parchmentmc.org/'
			content {
				includeGroup 'org.parchmentmc.data'
			}
		}
	}
}

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

spotless {
	java {
		target fileTree(dir: 'src/main/java/vazkii/psi', include: '**/*.java')
		eclipse().configFile 'spotless/eclipseformat.xml'
		removeUnusedImports()
		importOrderFile 'spotless/eclipse.importorder'
		replaceRegex 'Too much space after if', '(if|for|while|switch) +\\(', '$1('
	}
}

tasks.register('checkSyntax') {
	group = 'verification'
	dependsOn spotlessJavaCheck
	dependsOn ':Xplat:checkSyntax', ':Fabric:checkSyntax', ':NeoForge:checkSyntax'
}

tasks.register('buildAll') {
	group = 'build'
	dependsOn ':Xplat:build', ':Fabric:build', ':NeoForge:build'
}

def datagenFingerprint = { File directory ->
	if(!directory.exists()) {
		return [:]
	}

	def root = directory.toPath()
	fileTree(directory) {
		exclude '.cache/**'
	}.files.sort().collectEntries { file ->
		def digest = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
		[(root.relativize(file.toPath()).toString()): digest]
	}
}

def datagenBaseline = [:]
def snapshotDatagen = tasks.register('snapshotDatagen') {
	doLast {
		datagenBaseline.clear()
		datagenBaseline.putAll(datagenFingerprint(file('Xplat/src/generated/resources')))
	}
}

def checkDatagen = tasks.register('checkDatagen') {
	group = 'verification'
	description = 'Runs both loader datagens and verifies that generated resources do not change.'
	dependsOn snapshotDatagen, ':NeoForge:runData', ':Fabric:runXplatDatagen'
	doLast {
		def generated = datagenFingerprint(file('Xplat/src/generated/resources'))
		if(generated != datagenBaseline) {
			throw new GradleException('Datagen changed Xplat/src/generated/resources')
		}
	}
}

gradle.projectsEvaluated {
	def neoForgeDatagen = project(':NeoForge').tasks.named('runData')
	def fabricDatagen = project(':Fabric').tasks.named('runXplatDatagen')
	neoForgeDatagen.configure { mustRunAfter snapshotDatagen }
	fabricDatagen.configure { mustRunAfter neoForgeDatagen }
	checkDatagen.configure { mustRunAfter fabricDatagen }
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
